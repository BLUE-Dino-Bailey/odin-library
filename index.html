<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/js.js" defer></script>
    <title>Library</title>
</head>
<body>
    <nav>
            <h1>myLibrary</h1>
    </nav>
    <div class="nav-buttons">
        <div class="button-container">
        </div>
    </div>
    <div class="main-container">
        <div class="side-bar">
            <h2>Book Info</h2>

            <form>
                <div>
                    <label id="titleLabel" for="title">Title:</label>
                    <input type="text" id="titleInput">
                </div>
                <div>
                    <label id="authorLabel" for="author">Author:</label>
                    <input type="text" id="authorInput">
                </div>
                <div>
                    <label id="pagesLabel" for="pages">Pages:</label>
                    <input type="text" id="pagesInput">
                </div>
                <div>
                    <label id="readLabel" for="read">Read:</label>
                    <input type="checkbox" id="readInput" for="read" checked="true">
                </div>

                <button id="btn-submit" type="submit" popovertarget="status-dialog">Add Book</button>

                <dialog popovertarget="status-dialog">
                    <p>Book Successfully Registered</p>
                    <button popovertarget="status-dialog" popovertargetaction="hide">Close</button>
                </dialog>
            </form>
        </div>
        <div class=book-list id="book-container">
            <div class="book-card" data-bookID="12345">
                <div class="title">
                    <h3 id="title">Title: </h3>
                </div>
                <div class="book-info">
                    <h5 id="author">Author: </h5>
                    <h5 id="pages">Pages: </h5>
                    <h5 id="read">Read: </h5>
                </div>
                <div id="info">
                    <P>Lorem ipsum dolor, sit amet consectetur adipisicing elit. doloribus dolor!</P>
                </div>
                <div class="book-actions">
                    <button id="btn-completed">Completed!</button>
                    <button id="btn-delete">Delete</button>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <h4>©Copyright. All rights reserved.</h4>
    </footer>
</body>
</html>
